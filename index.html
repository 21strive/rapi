<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rapi — a quiet, data-first design system for Vue 3." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b3aab'/%3E%3Cpath d='M10.16 9.49L24.35 9.49L16.7 16.53L16.7 23.57L10.16 23.57Z' fill='%23fff'/%3E%3C/svg%3E" />
    <title>Rapi Design System</title>
    <script>
      // Resolve theme + brand before first paint so there is no flash.
      try {
        var root = document.documentElement
        var theme = localStorage.getItem('rapi-theme') || 'system'
        var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        root.dataset.theme = dark ? 'dark' : 'light'
        var brand = localStorage.getItem('rapi-brand')
        if (brand && brand !== 'blue') root.dataset.brand = brand
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
